<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恩點系統｜菜單後台</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="topbar">
    <h1>恩點系統｜菜單後台</h1>
    <p>新增、修改、上下架餐點</p>
  </header>

  <main class="admin-layout">
    <section class="panel">
      <h2>新增餐點</h2>

      <label>餐點名稱</label>
      <input id="itemName" type="text" placeholder="例如：鍋燒意麵" />

      <label>分類</label>
      <input id="itemCategory" type="text" placeholder="例如：鍋燒類、炒飯類" />

      <label>價格</label>
      <input id="itemPrice" type="number" placeholder="例如：100" />

      <label>圖片網址（先可空白）</label>
      <input id="itemImage" type="text" placeholder="之後可接圖片上傳" />

      <label>加料選項</label>
      <textarea id="itemOptions" placeholder="格式：加蛋:15,加肉:20,泡菜:20"></textarea>

      <button id="addItemBtn" class="primary-btn">新增餐點</button>
    </section>

    <section class="panel">
      <h2>目前菜單</h2>
      <div id="menuList" class="menu-list"></div>
    </section>
  </main>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
