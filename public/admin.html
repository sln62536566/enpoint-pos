<!--
  恩點系統 v58-1
  日期：2026-05-22
  端別：菜單後台 admin.html
  用途：分類管理器 + 菜單管理
-->

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恩點系統｜菜單後台</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="admin-page">
  <header class="topbar admin-topbar">
    <h1>恩點系統｜菜單後台</h1>
    <p>v58-1 分類管理器｜分類新增、改名、隱藏、刪除、排序</p>
  </header>

  <main class="admin-v57-layout">
    <section class="admin-form-panel">
      <div class="panel-title-row">
        <div>
          <h2>分類管理</h2>
          <p>建立分類、排序、顯示或隱藏分類</p>
        </div>
      </div>

      <label>新增分類</label>
      <div class="admin-inline-form">
        <input id="newCategoryName" type="text" placeholder="例如：鍋燒類" />
        <button id="addCategoryBtn" class="primary-btn">新增</button>
      </div>

      <div class="sort-hint">
        提示：分類可拖拉排序。隱藏分類後，之後 v58-3 會同步讓 POS / QR 不顯示該分類。
      </div>

      <div id="categoryManagerList" class="category-manager-list"></div>

      <hr class="admin-divider" />

      <div class="panel-title-row">
        <div>
          <h2 id="formTitle">新增餐點</h2>
          <p>建立餐點、分類、圖片與加料選項</p>
        </div>
      </div>

      <label>餐點名稱</label>
      <input id="itemName" type="text" placeholder="例如：鍋燒意麵" />

      <label>分類</label>
      <select id="itemCategory"></select>

      <label>價格</label>
      <input id="itemPrice" type="number" placeholder="例如：100" />

      <label>圖片網址</label>
      <input id="itemImage" type="text" placeholder="可先空白，之後可接圖片上傳" />

      <label>餐點描述</label>
      <textarea id="itemDescription" placeholder="例如：湯頭濃郁、份量充足，適合喜歡重口味的客人"></textarea>

      <label>必選選項</label>
      <div class="required-option-box">
        <input id="requiredOptionTitle" type="text" placeholder="選項名稱，例如：湯底、甜度、冰量" />
        <textarea id="requiredOptionChoices" placeholder="選項內容，用逗號分隔，例如：牛肉,肉骨,肉燥"></textarea>
        <p class="form-help">留空代表此餐點沒有必選項目。</p>
      </div>


      <label>加料選項</label>
      <div id="addonEditor" class="addon-editor"></div>
      <button id="addAddonRowBtn" class="secondary-btn" type="button">＋ 新增加料</button>

      <div class="admin-form-actions">
        <button id="addItemBtn" class="primary-btn">新增餐點</button>
        <button id="cancelEditBtn" class="secondary-btn" type="button">取消編輯</button>
      </div>
    </section>

    <section class="admin-menu-panel">
      <div class="panel-title-row">
        <div>
          <h2>目前菜單</h2>
          <p>可拖拉餐點調整同分類內顯示順序</p>
        </div>
      </div>

      <div class="admin-tools">
        <input id="menuSearchInput" type="text" placeholder="搜尋餐點名稱或分類..." />
        <div id="categoryFilterList" class="admin-filter-list"></div>
      </div>

      <div class="sort-hint">
        提示：餐點卡片可拖拉排序。分類排序請在左側「分類管理」操作。
      </div>

      <div id="menuList" class="admin-menu-list"></div>
    </section>
  </main>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
