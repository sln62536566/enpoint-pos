<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理後台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .admin-wrap {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 360px;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 16px;
      overflow-y: auto;
    }

    .content {
      flex: 1;
      padding: 16px;
    }

    .order-card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .order-card.active {
      background: #e8f2ff;
      border-color: #4f8cff;
    }

    .detail-panel {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      min-height: 300px;
    }

    .item-box {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="admin-wrap">
  <div class="sidebar">
    <h3>訂單列表</h3>
    <div id="orderList">載入中...</div>
  </div>

  <div class="content">
    <h3>訂單明細</h3>
    <div id="orderDetail" class="detail-panel">
      請選擇訂單
    </div>
  </div>
</div>

<script src="admin.js"></script>

<!-- 🔥 自動刷新（重點） -->
<script>
  setInterval(() => {
    if (typeof loadOrders === "function") {
      loadOrders();
    }
  }, 3000);
</script>

</body>
</html>
