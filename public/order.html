<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>查詢訂單</title>
</head>

<body>

<h2>查訂單</h2>
<input id="id">
<button onclick="search()">查</button>

<div id="result"></div>

<script type="module">
import { db, ref, onValue } from './firebase.js';

window.search = () => {
  const id = document.getElementById("id").value;

  onValue(ref(db, "orders"), (snap) => {
    const data = snap.val() || {};

    const found = Object.values(data).find(o => o.orderNumber === id);

    document.getElementById("result").innerHTML =
      found ? JSON.stringify(found) : "找不到";
  }, { onlyOnce: true });
};
</script>

</body>
</html>
