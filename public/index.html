<!--
  恩點系統 v58-5
  日期：2026-05-22
  端別：QR 客人端 index.html
  用途：補回內用 / 外帶選擇 + 保留 QR 點餐流程
-->

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="恩點系統" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>恩點系統｜QR 點餐</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/qr.css?v=615" />
</head>

<body class="qr-page">
  <header class="qr-header">
    <h1>恩點點餐</h1>
    <p id="tableInfo">掃碼點餐</p>
    <nav class="qr-top-tabs" aria-label="QR 點餐分頁">
      <a id="qrOrderTabLink" class="qr-top-tab active" href="javascript:void(0)" onclick="return window.qrShowMenuTab(event)" ontouchend="return window.qrShowMenuTab(event)">點餐</a>
      <a id="qrViewOrderPlainLink" class="qr-top-tab last-order-top-btn" href="javascript:void(0)" onclick="return window.qrShowOrderTab(event)" ontouchend="return window.qrShowOrderTab(event)">查看訂單</a>
    </nav>
</header>

  <section id="topOrderPanel" class="qr-top-order-panel hidden">
    <div class="qr-top-order-card">
      <h2>查看訂單</h2>
      <p class="qr-top-order-hint">送出訂單後，這裡會顯示剛剛的訂單內容。</p>
      <div id="topOrderContent"></div>
    </div>
  </section>

  <main id="orderPage" class="qr-layout">
    <section class="menu-area">
      <div id="categoryList" class="category-list"></div>
      <div id="menuList" class="menu-list"></div>
    </section>

    <aside id="qrCartPanel" class="cart-area">
      <div class="qr-cart-title-row">
        <h2>我的餐點</h2>
        <button id="closeCartBtn" class="qr-cart-close-btn" type="button" onclick="return window.closeQrCartPanel(event)">×</button>
      </div>

      <div id="orderTypeBox" class="qr-order-type-box">
        <label>用餐方式</label>
        <div class="qr-order-type-row">
          <button id="qrDineInBtn" class="qr-type-btn active" type="button">內用</button>
          <button id="qrTakeOutBtn" class="qr-type-btn" type="button">外帶</button>
        </div>

        <input id="qrTableInput" class="input" placeholder="請輸入桌號，例如：5" />
        <p id="qrOrderTypeHint" class="qr-order-type-hint">請確認桌號或選擇外帶。</p>
      </div>

      <div id="cartList" class="cart-list"></div>

      <div class="cart-total">
        總計：<strong id="cartTotal">$0</strong>
      </div>

      <input id="customerName" class="input" placeholder="名字或綽號，可不填" />
      <textarea id="orderNote" class="input" placeholder="整張訂單備註，例如：餐具、取餐需求"></textarea>

      <button
        id="submitOrderBtn"
        class="primary-btn"
        type="button"
        onclick="return window.qrLegacyDirectSubmitOrder(event)"
        ontouchend="return window.qrLegacyDirectSubmitOrder(event)"
      >送出訂單</button>
    </aside>
  </main>

  <main id="successPage" class="success-page hidden">
    <div class="success-card">
      <h2>訂單已送出</h2>
      <p>請至櫃檯確認付款，店員確認付款後將立即安排製作餐點。</p>

      <div id="successContent"></div>

      <div id="orderStatusBox" class="order-status-box">
        狀態：等待櫃檯確認付款
      </div>

      <button id="newOrderBtn" class="primary-btn" type="button" onclick="return window.forceResetQrOrder(event)" ontouchend="return window.forceResetQrOrder(event)">再點一筆</button>
    </div>
  </main>

  <button id="floatingCartBtn" class="qr-floating-cart-btn" type="button" onclick="return window.openQrCartPanel(event)">購物車 $0</button>

  <div id="itemModal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModalBtn" class="modal-close">×</button>

      <h2 id="modalItemName"></h2>
      <p id="modalItemPrice" class="modal-price"></p>

      <div id="sizeSection" class="option-section"></div>
      <div id="addonsSection" class="option-section"></div>
      <div id="spicySection" class="option-section"></div>
      <div id="sataySection" class="option-section"></div>

      <div class="option-section">
        <h3>數量</h3>
        <div class="qty-row">
          <button id="qtyMinusBtn" type="button">－</button>
          <span id="modalQty">1</span>
          <button id="qtyPlusBtn" type="button">＋</button>
        </div>
      </div>

      <div class="option-section">
        <h3>備註</h3>
        <textarea id="itemNote" class="input" placeholder="例如：不要蔥、湯多一點"></textarea>
      </div>

      <div class="modal-footer">
        <div>小計：<strong id="modalSubtotal">$0</strong></div>
        <button id="addToCartBtn" class="primary-btn" type="button" onclick="return window.qrHardAddToCart(event)" ontouchend="return window.qrHardAddToCart(event)">加入購物車</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card confirm-card">
      <h2>確認訂單</h2>

      <div id="confirmContent"></div>

      <div class="confirm-total">
        總計：<strong id="confirmTotal">$0</strong>
      </div>

      <div class="confirm-actions">
        <button id="backToCartBtn" class="secondary-btn" type="button">返回修改</button>
        <button id="confirmSubmitBtn" class="primary-btn" type="button" onclick="return window.qrLegacyDirectSubmitOrder(event)" ontouchend="return window.qrLegacyDirectSubmitOrder(event)">確認送出</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      if (typeof window === "undefined" || typeof Element === "undefined") return;

      var proto = Element.prototype;

      if (!proto.matches) {
        proto.matches =
          proto.msMatchesSelector ||
          proto.webkitMatchesSelector ||
          function (selector) {
            var nodes = (this.document || this.ownerDocument).querySelectorAll(selector);
            var i = nodes.length;
            while (--i >= 0 && nodes.item(i) !== this) {}
            return i > -1;
          };
      }

      if (!proto.closest) {
        proto.closest = function (selector) {
          var el = this;
          while (el && el.nodeType === 1) {
            if (el.matches(selector)) return el;
            el = el.parentElement || el.parentNode;
          }
          return null;
        };
      }

      if (typeof HTMLElement !== "undefined" && !HTMLElement.prototype.showModal) {
        HTMLElement.prototype.showModal = function () {
          this.setAttribute("open", "");
          this.removeAttribute("hidden");
          this.hidden = false;
          this.style.display = "block";
          this.style.visibility = "visible";
          this.style.opacity = "1";
          this.className = (this.className || "").replace(/\bis-hidden\b/g, "");
          if ((" " + this.className + " ").indexOf(" show-force ") === -1) {
            this.className += " show-force";
          }
          document.documentElement.className += " modal-open";
          document.body.className += " modal-open";
        };
      }

      if (typeof window.HTMLDialogElement === "undefined" && typeof HTMLElement !== "undefined") {
        window.HTMLDialogElement = HTMLElement;
      }

      if (typeof HTMLElement !== "undefined" && !HTMLElement.prototype.show) {
        HTMLElement.prototype.show = HTMLElement.prototype.showModal;
      }

      if (typeof HTMLElement !== "undefined" && !HTMLElement.prototype.close) {
        HTMLElement.prototype.close = function () {
          this.removeAttribute("open");
          this.style.display = "none";
          this.className = (this.className || "").replace(/\bshow-force\b/g, "");
          document.documentElement.className = document.documentElement.className.replace(/\bmodal-open\b/g, "");
          document.body.className = document.body.className.replace(/\bmodal-open\b/g, "");
        };
      }
    })();
  </script>
  <script type="module" src="./js/app.js?v=615"></script>
</body>
</html>
