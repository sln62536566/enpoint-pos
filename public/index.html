<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>點餐系統</title>

<style>
body { font-family: sans-serif; padding:20px; }
.item {
  border:1px solid #ddd;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}
button {
  padding:8px 12px;
  margin-top:5px;
}
#cart {
  margin-top:20px;
  padding:10px;
  border:2px solid #333;
}
</style>
</head>

<body>

<h1>🍜 點餐系統</h1>

<div id="menu"></div>

<div id="cart">
  <h3>🛒 購物車</h3>
  <div id="cartItems"></div>
  <button onclick="submitOrder()">送出訂單</button>
</div>

<script type="module">
import { createOrder } from './app.js';

// 👉 菜單
const menu = [
  { name: "鍋燒意麵", price: 100 },
  { name: "鍋燒雞絲麵", price: 100 },
  { name: "鍋燒烏龍麵", price: 100 },
  { name: "炒飯", price: 80 },
  { name: "炒麵", price: 80 }
];

let cart = [];

// ==========================
// 📦 顯示菜單
// ==========================
const menuDiv = document.getElementById("menu");

menu.forEach(item => {
  const div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    <h3>${item.name}</h3>
    <p>$${item.price}</p>
    <button onclick="addToCart('${item.name}')">加入</button>
  `;

  menuDiv.appendChild(div);
});

// ==========================
// 🛒 購物車
// ==========================
window.addToCart = (name) => {
  cart.push(name);
  renderCart();
};

function renderCart() {
  const cartDiv = document.getElementById("cartItems");
  cartDiv.innerHTML = cart.join("<br>");
}

// ==========================
// 📤 送出訂單（🔥 Firebase版）
// ==========================
window.submitOrder = async () => {
  if (cart.length === 0) {
    alert("請先選擇餐點");
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const table = urlParams.get("table") || "外帶";

  await createOrder(cart, table);

  alert("✅ 訂單已送出");

  cart = [];
  renderCart();
};
</script>

</body>
</html>
