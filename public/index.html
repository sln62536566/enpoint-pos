<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>點餐系統</title>

<style>
body { font-family: sans-serif; padding:20px; }

.item {
  border:1px solid #ddd;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

#cart {
  margin-top:20px;
  border:2px solid #333;
  padding:10px;
}
</style>
</head>

<body>

<h1>🍜 點餐系統</h1>

<div id="menu"></div>

<div id="cart">
  <h3>🛒 購物車</h3>
  <div id="cartItems"></div>
  <button onclick="submitOrder()">送出訂單</button>
</div>

<script type="module">
import { listenMenu, createOrder } from './app.js';

const menuDiv = document.getElementById("menu");
let cart = [];

// ==========================
// 🍜 menu
// ==========================
listenMenu((menu) => {
  menuDiv.innerHTML = "";

  if (!menu.length) {
    menuDiv.innerHTML = "⚠️ 沒有菜單";
    return;
  }

  menu.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <h3>${item.name}</h3>
      <p>$${item.price}</p>
      <button onclick="add('${item.name}')">加入</button>
    `;

    menuDiv.appendChild(div);
  });
});

// ==========================
// 🛒 cart
// ==========================
window.add = (name) => {
  cart.push(name);
  document.getElementById("cartItems").innerHTML = cart.join("<br>");
};

// ==========================
// 📤 submit
// ==========================
window.submitOrder = async () => {
  const table = new URLSearchParams(location.search).get("table") || "外帶";

  await createOrder(cart, table);

  alert("✅ 已送出");

  cart = [];
  document.getElementById("cartItems").innerHTML = "";
};
</script>

</body>
</html>
