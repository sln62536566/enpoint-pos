<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恩點系統｜客人點餐</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="topbar">
    <h1>歡迎使用恩點點餐系統</h1>
    <p>請選擇您想要的餐點</p>
  </header>

  <main class="customer-layout">
    <section>
      <div id="orderResult" class="order-result hidden"></div>

      <div class="order-type-panel">
        <h2>用餐方式</h2>

        <div class="order-type-buttons">
          <button id="dineInBtn" class="type-btn active">內用</button>
          <button id="takeOutBtn" class="type-btn">外帶</button>
        </div>

        <input id="customerNameInput" type="text" placeholder="客人名稱 / 綽號（可不填）" />
        <input id="tableNumberInput" type="text" placeholder="桌號（掃 QR 會自動帶入）" />
      </div>

      <div id="menuContainer" class="menu-container"></div>
    </section>

    <aside class="cart-panel">
      <h2>目前點餐</h2>
      <div id="cartList"></div>

      <div class="cart-total">
        總金額：<strong id="totalAmount">$0</strong>
      </div>

      <button id="submitOrderBtn" class="primary-btn">
        送出訂單
      </button>
    </aside>
  </main>

  <div id="customModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 id="modalItemName">餐點客製化</h2>
      <p id="modalItemPrice" class="modal-price">$0</p>

      <label>數量</label>
      <div class="quantity-control">
        <button id="modalMinusBtn">-</button>
        <span id="modalQuantity">1</span>
        <button id="modalPlusBtn">+</button>
      </div>

      <label>辣度</label>
      <select id="spicySelect">
        <option value="不辣">不辣</option>
        <option value="微辣">微辣</option>
        <option value="小辣">小辣</option>
        <option value="中辣">中辣</option>
        <option value="大辣">大辣</option>
      </select>

      <label>加料</label>
      <div id="extrasBox" class="extras-box"></div>

      <label>備註</label>
      <textarea id="noteInput" placeholder="例如：不要蔥、湯多一點、沙茶另外放"></textarea>

      <div class="modal-actions">
        <button id="cancelCustomBtn" class="secondary-btn">取消</button>
        <button id="confirmCustomBtn" class="primary-btn">加入購物車</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/menu.js"></script>
</body>
</html>
