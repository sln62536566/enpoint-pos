<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>點餐</title>
</head>

<body>

<h1>點餐</h1>

<div id="info"></div>

<button onclick="order('鍋燒意麵')">鍋燒意麵</button>
<button onclick="order('鍋燒雞絲麵')">鍋燒雞絲麵</button>

<script type="module">
import { createOrder } from './app.js';

// 👉 取得桌號（QR用）
const params = new URLSearchParams(location.search);
const table = params.get("table") || "外帶";

document.getElementById("info").innerText = "桌號：" + table;

window.order = (item) => {
  createOrder([item], table);
};
</script>

</body>
</html>
