<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恩點系統｜QR 點餐</title>
  <link rel="stylesheet" href="./css/qr.css" />
</head>

<body class="qr-body">
  <header class="qr-header">
    <div>
      <h1 id="storeName">🍜 恩點點餐</h1>
      <p id="tableInfo">桌號載入中...</p>
    </div>
    <button id="languageToggle" class="small-btn">English</button>
  </header>

  <nav id="categoryTabs" class="category-tabs"></nav>

  <main class="qr-main">
    <section id="menuList" class="menu-grid"></section>
  </main>

  <button id="floatingCartBtn" class="floating-cart">
    🛒 <span id="cartCount">0</span>
    <strong id="cartTotal">NT$0</strong>
  </button>

  <section id="cartPanel" class="cart-panel hidden">
    <div class="cart-header">
      <h2>我的購物車</h2>
      <button id="closeCartBtn">×</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>總金額</span>
        <strong id="cartPanelTotal">NT$0</strong>
      </div>

      <input id="customerNameInput" class="input" placeholder="可輸入名字或綽號（選填）" />
      <textarea id="orderNoteInput" class="input textarea" placeholder="整筆訂單備註（選填）"></textarea>

      <button id="submitOrderBtn" class="primary-btn">送出訂單</button>
    </div>
  </section>

  <section id="itemModal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModalBtn" class="modal-close">×</button>

      <img id="modalImage" class="modal-image" src="" alt="餐點圖片" />

      <h2 id="modalTitle"></h2>
      <p id="modalDesc" class="muted"></p>

      <div id="sizeOptions" class="option-block"></div>
      <div id="addonOptions" class="option-block"></div>
      <div id="spicyOptions" class="option-block"></div>
      <div id="satayOptions" class="option-block"></div>

      <label class="field-label">備註</label>
      <textarea id="itemNoteInput" class="input textarea" placeholder="例如：不要蔥、湯多一點"></textarea>

      <div class="qty-row">
        <button id="minusQtyBtn">－</button>
        <strong id="itemQty">1</strong>
        <button id="plusQtyBtn">＋</button>
      </div>

      <button id="addToCartBtn" class="primary-btn">加入購物車 NT$0</button>
    </div>
  </section>

  <section id="orderDonePage" class="order-done hidden">
    <div class="done-card">
      <h2>✅ 訂單已送出</h2>
      <p class="muted">請保留此畫面，方便櫃檯核對。</p>

      <div id="doneOrderInfo" class="done-info"></div>

      <p class="wait-time">
        預估等待時間：<strong>15～20 分鐘</strong><br />
        <span>實際時間依現場狀況為準</span>
      </p>

      <button id="backToMenuBtn" class="secondary-btn">繼續點餐</button>
    </div>
  </section>

  <script type="module" src="./js/order.js"></script>
</body>
</html>
