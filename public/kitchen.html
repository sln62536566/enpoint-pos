<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>廚房訂單系統</title>

<style>
body {
  font-family: sans-serif;
  background: #111;
  color: #fff;
  margin: 0;
}

.header {
  background: #ff6600;
  padding: 15px;
  font-size: 24px;
  text-align: center;
}

.container {
  padding: 10px;
}

.order {
  border: 2px solid #444;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 10px;
}

.pending { border-color: #888; }
.cooking { border-color: yellow; }
.done { border-color: lime; opacity: 0.5; }

button {
  margin: 5px;
  padding: 8px 12px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="header">🔥 廚房訂單</div>
<div class="container" id="orders"></div>

<script type="module">
import { listenOrders, updateStatus, autoClean } from './app.js';

const container = document.getElementById('orders');

function render(orders) {
  container.innerHTML = "";

  orders.forEach(order => {
    const div = document.createElement('div');
    div.className = `order ${order.status}`;

    // 🔥 這就是你剛剛那段，我已經幫你放好
    div.innerHTML = `
      <div>📢 訂單號：${order.orderNumber}</div>
      <div>桌號：${order.table}</div>
      <div>🕒 ${new Date(order.createdAt).toLocaleTimeString()}</div>
      <div>🍜 ${order.items.join(", ")}</div>
      <div>狀態：${order.status}</div>

      <button onclick="setCooking('${order.id}')">開始做</button>
      <button onclick="setDone('${order.id}')">完成</button>
    `;

    container.appendChild(div);
  });
}

window.setCooking = (id) => {
  updateStatus(id, "cooking");
};

window.setDone = (id) => {
  updateStatus(id, "done");
};

listenOrders(render);
autoClean();
</script>

</body>
</html>
