<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恩點 POS v39（店員 POS）</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
  padding-bottom:180px;
}
header{
  background:#0077cc;
  padding:15px;
  font-size:20px;
  font-weight:bold;
  color:#fff;
}
.card{
  background:#fff;
  margin:10px;
  padding:10px;
  border-radius:10px;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:10px;
  padding:10px;
}
.menu-item{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
  cursor:pointer;
  border-radius:10px;
}
.menu-item img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:5px;
}
.menu-item .price{
  font-weight:bold;
  color:#333;
}
.tools{
  background:#fff;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px;
  border-top:2px solid #ccc;
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<div id="app" style="padding:10px;">

  <header>👨‍🍳 恩點 POS v39（店員 POS）</header>

  <div class="card">
    桌號：<input id="tablePos" value="A1"><br>
    類型：<select id="typePos"><option>內用</option><option>外帶</option></select>
  </div>

  <div id="menuPos"></div>

  <div class="tools">
    <div id="cartPos"></div>
    <button onclick="showConfirmPos()">確認送出</button>
    <a href="manage-menu.html" style="color:#fff;background:#777;text-align:center;padding:10px;border-radius:10px;text-decoration:none;">📊 改菜單</a>
    <div id="dailyTotal" style="color:#c33;font-weight:bold;"></div>
  </div>

</div>
