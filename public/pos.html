<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恩點系統｜店員 POS</title>
  <link rel="stylesheet" href="./css/pos.css" />
</head>

<body>
  <div class="pos-app">
    <header class="pos-header">
      <div>
        <h1>恩點 POS</h1>
        <p>店員收銀・點餐・確認付款・送廚房</p>
      </div>

      <nav class="pos-tabs">
        <button class="tab-btn active" data-tab="orderTab">點餐</button>
        <button class="tab-btn" data-tab="todayTab">今日訂單</button>
        <button class="tab-btn" data-tab="databaseTab">資料庫</button>
        <button class="tab-btn" data-tab="statsTab">統計</button>
      </nav>
    </header>

    <main class="pos-main">
      <!-- 點餐頁 -->
      <section id="orderTab" class="tab-panel active">
        <div class="order-layout">
          <section class="menu-panel">
            <div class="panel-title">
              <h2>點餐區</h2>
              <p>選擇分類與餐點</p>
            </div>

            <div id="categoryList" class="category-list"></div>
            <div id="posMenuList" class="pos-menu-list"></div>
          </section>

          <aside class="cart-panel">
            <div class="panel-title">
              <h2>目前訂單</h2>
              <p>內用 / 外帶・桌號・結帳</p>
            </div>

            <div class="order-type-row">
              <button id="dineInBtn" class="type-btn active">內用</button>
              <button id="takeOutBtn" class="type-btn">外帶</button>
            </div>

            <div id="tableSelectBox" class="table-box">
              <h3>桌號</h3>
              <div id="tableButtons" class="table-buttons"></div>
            </div>

            <div id="takeOutInfo" class="takeout-info" style="display:none;">
              外帶訂單會自動產生取餐編號
            </div>

            <div id="cartList" class="cart-list"></div>

            <div class="cart-total">
              總計：<strong id="totalAmount">$0</strong>
            </div>

            <div class="cart-actions-main">
              <button id="submitOrderBtn" class="primary-btn">建立未結帳訂單</button>
              <button id="clearCartBtn" class="secondary-btn">清空</button>
            </div>
          </aside>
        </div>
      </section>

      <!-- 今日訂單 -->
      <section id="todayTab" class="tab-panel">
        <div class="orders-layout">
          <section class="orders-column">
            <div class="panel-title">
              <h2>待確認 / 未結帳</h2>
              <p>QR 或現場建立後，先在這裡確認付款</p>
            </div>
            <div id="pendingOrderList" class="order-list"></div>
          </section>

          <section class="orders-column">
            <div class="panel-title">
              <h2>製作中 / 已送廚房</h2>
              <p>已確認付款並送廚房的訂單</p>
            </div>
            <div id="processingOrderList" class="order-list"></div>
          </section>
        </div>
      </section>

      <!-- 資料庫 -->
      <section id="databaseTab" class="tab-panel">
        <div class="database-layout">
          <section class="orders-column">
            <div class="panel-title">
              <h2>已完成訂單</h2>
              <p>完成後自動移到這裡，不佔主畫面</p>
            </div>
            <div id="doneOrderList" class="order-list"></div>
          </section>

          <section class="orders-column">
            <div class="panel-title">
              <h2>已取消訂單</h2>
              <p>取消與異常訂單紀錄</p>
            </div>
            <div id="cancelledOrderList" class="order-list"></div>
          </section>
        </div>
      </section>

      <!-- 統計 -->
      <section id="statsTab" class="tab-panel">
        <div class="stats-grid">
          <div class="stat-card">
            <span>今日訂單</span>
            <strong id="statTotalOrders">0</strong>
          </div>

          <div class="stat-card">
            <span>未結帳</span>
            <strong id="statUnpaidOrders">0</strong>
          </div>

          <div class="stat-card">
            <span>製作中</span>
            <strong id="statProcessingOrders">0</strong>
          </div>

          <div class="stat-card">
            <span>已完成</span>
            <strong id="statDoneOrders">0</strong>
          </div>

          <div class="stat-card revenue">
            <span>今日營收</span>
            <strong id="statTodayRevenue">$0</strong>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 餐點選項 Modal -->
  <div id="customModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalItemName">餐點名稱</h2>
      <p id="modalItemPrice" class="modal-price">NT$0</p>

      <div id="portionBox" class="option-section"></div>

      <div class="option-section">
        <h3>辣度</h3>
        <select id="spicySelect" class="select-input">
          <option value="不辣">不辣</option>
          <option value="微辣">微辣</option>
          <option value="小辣">小辣</option>
          <option value="中辣">中辣</option>
          <option value="大辣">大辣</option>
        </select>
      </div>

      <div id="satayBox" class="option-section"></div>

      <div class="option-section">
        <h3>加料</h3>
        <div id="extrasBox" class="extras-box"></div>
      </div>

      <div class="option-section">
        <h3>數量</h3>
        <div class="qty-row">
          <button id="modalMinusBtn">－</button>
          <span id="modalQuantity">1</span>
          <button id="modalPlusBtn">＋</button>
        </div>
      </div>

      <div class="option-section">
        <h3>備註</h3>
        <textarea id="noteInput" class="note-input" placeholder="例如：不要蔥、湯多一點"></textarea>
      </div>

      <div class="modal-actions">
        <button id="cancelCustomBtn" class="secondary-btn">取消</button>
        <button id="confirmCustomBtn" class="primary-btn">加入訂單</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/pos.js?v=20260517"></script>
</body>
</html>
