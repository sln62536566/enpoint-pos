<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恩點系統｜店員 POS</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="topbar">
    <h1>恩點系統｜店員 POS 總控台</h1>
    <p>點餐、結帳、確認送廚房、改單</p>
  </header>

  <main class="pos-layout">
    <section class="pos-panel">
      <h2>分類</h2>
      <div id="categoryList" class="category-list"></div>
    </section>

    <section class="pos-panel pos-menu-panel">
      <h2>餐點</h2>
      <div id="posMenuList" class="pos-menu-list"></div>
    </section>

    <section class="pos-panel pos-cart-panel">
      <h2>目前點餐</h2>

      <label>點餐類型</label>
      <div class="type-buttons">
        <button id="dineInBtn" class="active">內用</button>
        <button id="takeOutBtn">外帶</button>
      </div>

      <div id="tableSelectBox">
        <label>桌號</label>
        <div id="tableButtons" class="type-buttons"></div>
      </div>

      <div id="takeOutInfo" style="display:none;">
        <p>外帶會自動產生訂單號。</p>
      </div>

      <div id="cartList" class="cart-list"></div>

      <h3>總金額：<span id="totalAmount">$0</span></h3>

      <button id="submitOrderBtn" class="primary-btn">建立未結帳訂單</button>
      <button id="clearCartBtn" class="danger-btn">清空購物車</button>
    </section>
  </main>

  <section class="pos-orders-panel">
    <h2>今日營業小統計</h2>

    <div class="today-stats-grid">
      <div class="today-stat-card">
        <span>今日訂單</span>
        <strong id="statTotalOrders">0</strong>
      </div>

      <div class="today-stat-card">
        <span>未結帳</span>
        <strong id="statUnpaidOrders">0</strong>
      </div>

      <div class="today-stat-card">
        <span>製作中</span>
        <strong id="statProcessingOrders">0</strong>
      </div>

      <div class="today-stat-card">
        <span>已完成</span>
        <strong id="statDoneOrders">0</strong>
      </div>

      <div class="today-stat-card">
        <span>今日營業額</span>
        <strong id="statTodayRevenue">$0</strong>
      </div>
    </div>
  </section>

  <section class="pos-orders-panel">
    <h2>今日訂單總控</h2>
    <p>未結帳訂單可改單；已送廚房訂單暫不開放修改。</p>
    <div id="todayOrderList" class="today-order-list"></div>
  </section>

  <div id="customModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modalItemName">餐點名稱</h2>
      <p id="modalItemPrice">$0</p>

      <label>數量</label>
      <div class="quantity-control">
        <button id="modalMinusBtn">-</button>
        <span id="modalQuantity">1</span>
        <button id="modalPlusBtn">+</button>
      </div>

      <label>辣度</label>
      <select id="spicySelect">
        <option value="不辣">不辣</option>
        <option value="小辣">小辣</option>
        <option value="中辣">中辣</option>
        <option value="大辣">大辣</option>
      </select>

      <label>加料</label>
      <div id="extrasBox"></div>

      <label>備註</label>
      <textarea id="noteInput" placeholder="例如：不要蔥、湯多一點"></textarea>

      <div class="modal-actions">
        <button id="cancelCustomBtn">取消</button>
        <button id="confirmCustomBtn" class="primary-btn">加入訂單</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/pos.js"></script>
</body>
</html>
