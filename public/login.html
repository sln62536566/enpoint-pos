<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>登入 POS</title>
</head>

<body>

<h2>恩點系統登入</h2>

<select id="role">
  <option value="customer">客人</option>
  <option value="kitchen">廚房</option>
  <option value="cashier">收銀</option>
  <option value="admin">老闆</option>
</select>

<button onclick="login()">進入系統</button>

<script>

function login(){
  const role = document.getElementById("role").value;

  // 👉 存角色
  localStorage.setItem("role", role);

  // 👉 導向主系統
  location.href = "/index.html";
}

</script>

</body>
</html>
